<header class="sticky top-0 z-50 border-b border-[#f1dedb] bg-[#fff8f7]/95 backdrop-blur">
  <nav class="mx-auto flex h-[72px] max-w-7xl items-center justify-between px-6 lg:px-10">

    <!-- Logo + categories -->
    <div class="flex items-center gap-8">
      <a routerLink="/home" class="text-3xl font-extrabold text-[#b83232] tracking-tight">
        Ayni
      </a>

      <div class="hidden lg:flex items-center gap-7 text-sm font-medium text-[#3d2c2c]">
        <a routerLink="/catalog" [queryParams]="{ category: 'belleza' }" class="shop-link">
          Belleza
        </a>

        <a routerLink="/catalog" [queryParams]="{ category: 'cuidado-personal' }" class="shop-link">
          Cuidado Personal
        </a>

        <a routerLink="/catalog" [queryParams]="{ category: 'hogar' }" class="shop-link">
          Hogar
        </a>

        <a routerLink="/catalog" [queryParams]="{ category: 'accesorios' }" class="shop-link">
          Accesorios
        </a>

        @if (isAdmin) {
        <a routerLink="/admin/dashboard" class="shop-link text-[#b83232] font-bold">
          Panel admin
        </a>
        }
      </div>
    </div>

    <!-- Search + actions -->
    <div class="flex items-center gap-4">

      <!-- Search -->
      <div
        class="hidden md:flex h-12 w-[280px] items-center gap-3 rounded-full border border-[#f0d6d2] bg-[#fff1ef] px-5">
        <span class="text-[#6b4b4b]">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
        </span>

        <input type="text" placeholder="Buscar..."
          class="w-full bg-transparent text-sm text-[#4c3a3a] outline-none placeholder:text-[#9a817e]" />
      </div>

      <!-- Favorites -->
      @if (isLoggedIn) {
      <a routerLink="/user/favorites" class="icon-button" title="Favoritos">
        <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path
            d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z">
          </path>
        </svg>
      </a>

      <a routerLink="/user/cart" class="icon-button" title="Carrito">
        <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
        </svg>
      </a>

      <div class="relative">
        <button type="button" class="icon-button" title="Usuario" (click)="toggleUserMenu($event)">
          <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M20 21a8 8 0 0 0-16 0"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>

        @if (isUserMenuOpen()) {
        <div class="absolute right-0 mt-3 w-56 rounded-2xl border border-[#f0d8d5] bg-white p-3 shadow-xl"
          (click)="$event.stopPropagation()">
          <p class="px-3 py-2 text-sm text-[#7d6664]">
            Hola, <strong class="text-[#2b2424]">{{ userName }}</strong>
          </p>

          <a routerLink="/user/profile" class="dropdown-link" (click)="closeUserMenu()">
            Mi perfil
          </a>

          <a routerLink="/user/orders" class="dropdown-link" (click)="closeUserMenu()">
            Mis pedidos
          </a>

          @if (isAdmin) {
          <a routerLink="/admin/dashboard" class="dropdown-link text-[#b83232] font-bold" (click)="closeUserMenu()">
            Panel admin
          </a>
          }

          <button type="button" (click)="logout()" class="dropdown-link w-full text-left text-[#b83232]">
            Cerrar sesión
          </button>
        </div>
        }
      </div>
      } @else {
      <a routerLink="/login" class="icon-button" title="Iniciar sesión">
        <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M20 21a8 8 0 0 0-16 0"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </a>
      }
    </div>
  </nav>
</header>
