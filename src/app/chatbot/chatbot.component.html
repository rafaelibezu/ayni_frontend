<div class="chatbot-container">
  <!-- Ventana del Chat -->
  <div class="chat-window" *ngIf="isOpen">
    <div class="chat-header">
      <div class="bot-info">
        <div class="avatar">🤖</div>
        <span class="bot-name">Asistente Ayni</span>
      </div>
      <button class="close-btn" (click)="toggleChat()">✖</button>
    </div>

    <div class="chat-messages">
      <div *ngFor="let msg of messages" 
           [ngClass]="{'message-user': msg.sender === 'user', 'message-bot': msg.sender === 'bot'}">
        <div class="bubble">
          {{ msg.text }}
        </div>
      </div>
      <div *ngIf="isLoading" class="message-bot loading">
        <div class="bubble">Escribiendo... ✍️</div>
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" 
             [(ngModel)]="userInput" 
             (keyup.enter)="sendMessage()" 
             placeholder="Escribe tu mensaje..."
             [disabled]="isLoading">
      <button (click)="sendMessage()" [disabled]="isLoading || !userInput.trim()">Enviar</button>
    </div>
  </div>

  <!-- Botón Flotante -->
  <button class="floating-btn" (click)="toggleChat()">
    💬
  </button>
</div>
