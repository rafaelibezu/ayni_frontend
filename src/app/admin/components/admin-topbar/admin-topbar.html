<header class="admin-topbar">
  <button type="button" class="menu-button" title="Menu">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 7h16"></path>
      <path d="M4 12h16"></path>
      <path d="M4 17h16"></path>
    </svg>
  </button>

  <div class="search-box">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </svg>

    <input
      type="text"
      placeholder="Buscar pedidos, productos, clientes..."
    />

    <span>Ctrl K</span>
  </div>

  <div class="topbar-actions">
    <button type="button" class="notification-button" title="Notificaciones">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>

      <span>3</span>
    </button>

    <div class="admin-profile">
      <div class="avatar">
        {{ adminName.charAt(0) }}
      </div>

      <div>
        <strong>{{ adminName }}</strong>
        <p>Administrador</p>
      </div>

      <button type="button" (click)="logout()" title="Cerrar sesion">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
